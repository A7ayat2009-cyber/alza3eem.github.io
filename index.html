<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الموقع تحت الصيانة</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 500px;
            padding: 40px;
            background: #1e293b;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }
        h1 {
            font-size: 28px;
            margin-bottom: 15px;
            color: #38bdf8;
        }
        p {
            font-size: 18px;
            color: #94a3b8;
            margin-bottom: 25px;
            line-height: 1.6;
        }
        .badge {
            display: inline-block;
            background: #0369a1;
            color: #e0f2fe;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="badge">نعود قريباً</div>
        <h1>الموقع يخضع للصيانة</h1>
        <p>نقوم حالياً بتحديثات وتحسينات لفترة قصيرة جداً.<br>ساعات قليلة ونكون معكم، انتظرونا!</p>
    </div>

</body>
</html>
